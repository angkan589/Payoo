<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>

<body class="bg-slate-100 h-[100vh] flex justify-center items-center flex-col">
    <div class="h-[130px] w-[300px] bg-[url(../Payoo-MFS-Resources/assets/bg.png)] bg-cover flex justify-center items-center">
        <img src="./Payoo-MFS-Resources/assets/Group.png" alt="">
    </div>
    <fieldset class="fieldset bg-white border-base-300 rounded-box w-xs border p-7 rounded-[30px]">
        <label class="label text-base fieldset-legend">Mobile Number</label>
        <input id="mobile-number" type="number" class="bg-slate-100 input rounded-[50px] border-none p-5" placeholder="Enter Your Number" />
        <label class="label text-base fieldset-legend">4-Digit Pin</label>
        <input id="pin-number" type="number" class="bg-slate-100 input rounded-[50px] border-none p-5" placeholder="Enter 4-Digit Pin" />
        <button type="button" id="log-in-btn" class="btn btn-neutral mt-4 rounded-[50px] bg-blue-500 border-none text-white text-lg">Login</button>
    </fieldset>
    <script src="./index.js"></script>
</body>

</html>
